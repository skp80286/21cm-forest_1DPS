name: torch_env
channels:
  - conda-forge
  - defaults
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
dependencies:
  - python=3.11
  - numpy[version='<2']
  - astropy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - scikit-learn
  - openpyxl
prefix: /opt/anaconda3/envs/torch_env
